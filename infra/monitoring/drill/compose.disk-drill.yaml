# Alert drill overlay (scripts/ops/drill-alerts.sh): node-exporter watches a 64 MiB tmpfs volume at /pgdata instead of
# the real PostgreSQL volume, so the disk-exhaustion alert can be induced by filling it. Never use outside the drill.
services:
  node-exporter:
    volumes: !override ["diskdrill:/pgdata:ro"]
volumes:
  diskdrill:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m" }
