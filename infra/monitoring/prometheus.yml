# CLUSTERX Prometheus configuration (M8, NFR-OBS-01). Used by the optional `monitoring` compose profile
# (infra/compose/compose.yaml) and by infra/production. Infrastructure telemetry only: job truth is the
# database (MASTER_PROMPT §6); the clusterx_* gauges are read from it on each scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

# No Alertmanager is shipped (OD-04: no external notification service is approved). Firing alerts are
# visible at /alerts and /api/v1/alerts on the private Prometheus port; wire an alertmanager_config here.
scrape_configs:
  - job_name: clusterx-control-plane
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["control-plane:9091"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
