# Production example Prometheus: scrapes the control plane's internal metrics listener over TLS (internal CA).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: clusterx-control-plane
    scheme: https
    tls_config:
      ca_file: /run/secrets/internal_ca_crt
      server_name: control-plane
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["cp-metrics:9091"] # monitoring-network alias; certificate name stays control-plane
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
