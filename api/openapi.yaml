  responses:
    BadRequest:
      description: Malformed request (bad JSON, wrong content type).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: bad_request, message: "Request body is not valid JSON.", request_id: "req_01JD3A" }
    InvalidCursor:
      description: Cursor malformed, expired or bound to different filters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: invalid_cursor, message: "Cursor does not match the current filters.", request_id: "req_01JD3B" }
    Unauthenticated:
      description: Missing, expired, revoked or invalid credentials / service assertion / session.
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthenticated, message: "Authentication required.", details: { reason: session_expired }, request_id: "req_01JD3C" }
    Forbidden:
      description: Authenticated but role/scope does not permit this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: forbidden, message: "Your role does not allow this action.", details: { required: operator, role: viewer }, request_id: "req_01JD3D" }
    JobNotFound:
      description: No such job (or deleted by retention). Same response for nonexistent and inaccessible IDs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: job_not_found, message: "Job not found.", request_id: "req_01JD3E" }
    WorkerNotFound:
      description: No such worker.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: worker_not_found, message: "Worker not found.", request_id: "req_01JD3F" }
    JobTerminal:
      description: Job already reached succeeded/failed; cancel is a conflict (success is never rolled back).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: job_terminal, message: "Job already finished.", details: { status: succeeded, terminal_at: '2026-11-17T10:00:09Z' }, request_id: "req_01JD3G" }
    IdempotencyConflict:
      description: Same Idempotency-Key in scope with a different request fingerprint (within 24h).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: idempotency_conflict, message: "Idempotency-Key was used with a different request.", details: { job_id: 0193a0f2-7c1e-7a10-8000-0000000000a1 }, request_id: "req_01JD3H" }
    PayloadTooLarge:
      description: Body > 80 KiB or payload > 64 KiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: payload_too_large, message: "Payload exceeds 65536 bytes.", details: { limit_bytes: 65536, field: payload }, request_id: "req_01JD3I" }
    ValidationFailed:
      description: Semantically invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_failed
            message: "Request has invalid fields."
            details:
              fields:
                - { field: priority, rule: range, message: "must be between 0 and 9" }
                - { field: handler_name, rule: registered, message: "unknown handler thumbnail.render@7" }
            request_id: "req_01JD3J"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: rate_limited, message: "Too many requests.", details: { retry_after_seconds: 2 }, request_id: "req_01JD3K" }
    Unavailable:
      description: Database unavailable or coordinator not ready. No 2xx means no acknowledgment; if the connection failed during COMMIT the outcome is unknown, so clients retry with the same Idempotency-Key.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unavailable, message: "Service temporarily unavailable. The request was not acknowledged; retry with the same Idempotency-Key.", request_id: "req_01JD3L" }
