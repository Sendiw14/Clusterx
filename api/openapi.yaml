  responses:
    BadRequest:
      description: Malformed request (bad JSON, wrong content type).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: bad_request, message: "Request body is not valid JSON.", request_id: "req_01JD3A" }
    InvalidCursor:
      description: Cursor malformed, expired or bound to different filters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: invalid_cursor, message: "Cursor does not match the current filters.", request_id: "req_01JD3B" }
    Unauthenticated:
      description: |
        Missing, expired, revoked or invalid credentials. `details.reason` tells the BFF what to do (ADR-0006):
        session_expired (details.expiry = idle | absolute) | session_revoked | user_disabled ⇒ end the browser session
        (user_disabled ⇒ /login?error=user_disabled, not a re-login prompt);
        assertion_invalid | assertion_expired ⇒ BFF fault, retry once with a fresh assertion, else surface as 502 — never a login loop;
        token_invalid | token_revoked | token_expired | user_disabled (token owner disabled) ⇒ direct API token problem.
        An assertion whose sid belongs to a different user than sub ⇒ assertion_invalid.
        On POST /api/v1/sessions only assertion_invalid | assertion_expired can occur (there is no session yet).
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: unauthenticated, message: "Authentication required.", details: { reason: session_expired }, request_id: "req_01JD3C" }
    Forbidden:
      description: Authenticated but role/scope does not permit this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: forbidden, message: "Your role does not allow this action.", details: { required: operator, role: viewer }, request_id: "req_01JD3D" }
    Expired:
      description: The resource existed but was deleted by retention (ADR-0004). Distinct from 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: expired, message: "This job's data has expired.", details: { terminal_at: '2026-10-01T09:00:00Z', expired_at: '2026-10-31T09:05:00Z', retention_days: 30 }, request_id: "req_01JD3M" }
    Internal:
      description: Unexpected server error. Nothing is acknowledged; the body never contains internals.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: internal, message: "Something went wrong. Quote the request id when reporting it.", request_id: "req_01JD3N" }
    JobNotFound:
      description: No such job. A job deleted by retention answers 410 expired instead (while its tombstone exists, 90 d).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: job_not_found, message: "Job not found.", request_id: "req_01JD3E" }
    WorkerNotFound:
      description: No such worker.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: worker_not_found, message: "Worker not found.", request_id: "req_01JD3F" }
    JobTerminal:
      description: Job already reached succeeded/failed; cancel is a conflict (success is never rolled back).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: job_terminal, message: "Job already finished.", details: { status: succeeded, version: 6, terminal_at: '2026-11-17T10:00:09Z' }, request_id: "req_01JD3G" }
    IdempotencyConflict:
      description: Same Idempotency-Key in scope with a different request fingerprint (within 24h).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: idempotency_conflict, message: "Idempotency-Key was used with a different request.", details: { job_id: 0193a0f2-7c1e-7a10-8000-0000000000a1 }, request_id: "req_01JD3H" }
    PayloadTooLarge:
      description: Body > 80 KiB or payload > 64 KiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: payload_too_large, message: "Payload exceeds 65536 bytes.", details: { limit_bytes: 65536, field: payload }, request_id: "req_01JD3I" }
    ValidationFailed:
      description: Semantically invalid input. `details` follows `ValidationDetails`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  details: { $ref: '#/components/schemas/ValidationDetails' }
          example:
            code: validation_failed
            message: "Request has invalid fields."
            details:
              fields:
                - { field: /priority, rule: range, message: "must be between 0 and 9", limit: { min: 0, max: 9 } }
                - { field: /handler_name, rule: registered, message: "unknown handler thumbnail.render@7" }
