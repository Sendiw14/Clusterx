# CLUSTERX supply-chain gate (MASTER_PROMPT §7, AC-25): govulncheck, OSV (pnpm + Go), gitleaks (history + tree), SPDX SBOMs
# of the built images. No new third-party actions: tools are `go install`ed at pinned versions. Integrator review required.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories against unchanged code
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.work }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: install pinned scanners
        run: GOBIN="$HOME/bin" ./scripts/security/install-tools.sh && echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: build images for SBOM
        run: |
          docker build -q -f apps/control-plane/Dockerfile -t clusterx/control-plane:ci .
          docker build -q -f apps/worker/Dockerfile -t clusterx/worker:ci .
      - name: scans
        env:
          CLUSTERX_SBOM_IMAGES: clusterx/control-plane:ci clusterx/worker:ci
        run: ./scripts/security/scan.sh "$RUNNER_TEMP/security"
      - name: reports
        if: always()
        run: for f in "$RUNNER_TEMP"/security/*.txt; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done
