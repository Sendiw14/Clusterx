# CLUSTERX PR gate (§11). Third-party actions pinned to full commit SHAs (§7).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:lint
      - run: pnpm sdk:check
      - run: pnpm --filter @clusterx/sdk-ts typecheck

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.work }
      - name: install PostgreSQL 18 binaries (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/postgres --version
      - run: pnpm --filter web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter web e2e
        env:
          CLUSTERX_E2E_PG_BIN: /usr/lib/postgresql/18/bin
          CLUSTERX_E2E_PG_DIR: ${{ runner.temp }}/e2e-pg
      - name: summarize e2e failures (public annotation; job logs need a GitHub login)
        if: failure()
        working-directory: apps/web
        run: |
          python3 - <<'PY'
          import json, os, glob
          out = []
          try:
              d = json.load(open("test-results/e2e.json"))
              def walk(suite, path=""):
                  for sp in suite.get("specs", []):
                      for t in sp.get("tests", []):
                          for r in t.get("results", []):
                              if r.get("status") not in ("passed", "skipped"):
                                  e = (r.get("error") or {}).get("message", "").strip().splitlines()
                                  out.append(f"{t.get('projectName')}: {sp.get('file')} :: {sp.get('title')} [{r.get('status')}] {e[0][:160] if e else ''}")
                  for s2 in suite.get("suites", []): walk(s2)
              for s in d.get("suites", []): walk(s)
              out.append(f"stats: {d.get('stats')}")
          except Exception as ex:
              out.append(f"no e2e.json ({ex}); e2e failed before tests ran")
          for f in glob.glob(".e2e/*.log"):
              out.append(f"--- tail {f}")
              out += open(f, errors="replace").read().splitlines()[-15:]
          msg = "%0A".join(x.replace("%", "%25").replace("\r", "") for x in out[:80])
          print(f"::error title=e2e failures::{msg}")
          PY

  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-bookworm
        env: { POSTGRES_USER: clusterx, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clusterx" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLUSTERX_PG_ADMIN_DSN: postgres://clusterx@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.work }
      - name: proto codegen is reproducible
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          ./packages/proto/generate.sh && git diff --exit-code packages/proto/gen
      - name: install PostgreSQL 18 binaries (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/postgres --version
      - name: vet and race tests (all modules)
        run: |
          for m in $(go list -f '{{.Dir}}' -m); do (cd "$m" && go vet ./... && go test -race -count=1 ./...); done
