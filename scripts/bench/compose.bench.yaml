# Benchmark overlay for infra/compose/compose.yaml (paths are relative to infra/compose).
# Adds pg_stat_statements + lock-wait logging, disables the per-principal mutation rate limit (the
# benchmark measures admission, not the limiter; disclosed in docs/testing/benchmarks.md), and two more
# workers so 1/3/5-worker runs use one stack.
services:
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top",
              "-c", "log_lock_waits=on", "-c", "deadlock_timeout=100ms"]
  control-plane:
    environment:
      CLUSTERX_RATE_MUTATIONS_PER_SECOND: "0"
  worker-4:
    image: ${CLUSTERX_IMAGE_PREFIX:-clusterx}/worker:local
    profiles: [workers]
    environment: &w
      CLUSTERX_ENV: development
      CLUSTERX_WORKER_CONTROL_PLANE_ADDR: control-plane:9090
      CLUSTERX_WORKER_INSECURE: "true"
      CLUSTERX_WORKER_CAPACITY: "4"
      CLUSTERX_WORKER_NAME: worker-4
      CLUSTERX_WORKER_CREDENTIAL_FILE: /run/secrets/worker_credential_4
    secrets: [worker_credential_4]
    depends_on: [control-plane]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
  worker-5:
    image: ${CLUSTERX_IMAGE_PREFIX:-clusterx}/worker:local
    profiles: [workers]
    environment:
      <<: *w
      CLUSTERX_WORKER_NAME: worker-5
      CLUSTERX_WORKER_CREDENTIAL_FILE: /run/secrets/worker_credential_5
    secrets: [worker_credential_5]
    depends_on: [control-plane]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
secrets:
  worker_credential_4: { file: ./.secrets/worker_credential_4 }
  worker_credential_5: { file: ./.secrets/worker_credential_5 }
